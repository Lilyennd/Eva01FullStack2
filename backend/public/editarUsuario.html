<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow border-0 rounded-4 p-4">
        <h3 class="text-center mb-4 fw-bold">Editar Usuario</h3>

        <div id="mensajeUsuario"></div>

        <form id="formEditarUsuario">
          <input type="hidden" id="id_usuario">

          <div class="mb-3">
            <label class="form-label">RUN</label>
            <input type="text" class="form-control" id="run" maxlength="9" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Apellidos</label>
            <input type="text" class="form-control" id="apellidos" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="correo" required>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-warning flex-fill fw-bold">Guardar Cambios</button>
            <a href="listarUsuarios.html" class="btn btn-outline-secondary flex-fill">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
