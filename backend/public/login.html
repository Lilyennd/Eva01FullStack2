  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-5">
        <div class="card shadow border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            <h3 class="card-title text-center mb-4 fw-bold">Iniciar Sesión</h3>

            <form id="formLogin">
              <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="correo" placeholder="nombre@dominio.cl" maxlength="100" required>
                <div class="form-text text-danger" id="error-correo"></div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                <div class="form-text text-danger" id="error-password"></div>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Entrar</button>
            </form>

            <p class="text-center mt-3 mb-0">
              ¿No tienes cuenta? <a href="registroUsuario.html">Regístrate</a>
            </p>
          </div>
        </div>
      </div>
