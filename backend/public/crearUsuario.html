<html lang="es">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light background">

  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="homeAdministrador.html">Splendor</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto" id="menuAdmin">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="inventario.html">Inventario</a></li>
          <li class="nav-item"><a class="nav-link" href="nuevoProducto.html">Nuevo producto</a></li>
          <li class="nav-item"><a class="nav-link" href="listarUsuarios.html">Usuarios</a></li>
          <li class="nav-item"><a class="nav-link" href="crearUsuario.html">Nuevo usuario</a></li>
        </ul>
        <ul class="navbar-nav me-auto" id="menuComprador" style="display: none;">
          <li class="nav-item"><a class="nav-link" href="home.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
        <a href="login.html" class="btn btn-outline-primary" id="btnIniciarSesion" style="display: none;">
          Iniciar sesión
        </a>
        <button class="btn btn-outline-danger" id="btnCerrarSesion">
          Cerrar sesión
        </button>

      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100 py-4">
      <div class="col-md-7 col-lg-6">
        <div class="card shadow border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            <h3 class="card-title text-center mb-4 fw-bold">Crear Nuevo Usuario</h3>

            <form id="formRegistroUsuario">

              <div class="mb-3">
                <label for="run" class="form-label">RUN</label>
                <input type="text" class="form-control" id="run" placeholder="Ej: 19011022K (sin puntos ni guion)" maxlength="9" required>
                <div class="invalid-feedback" id="error-run"></div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="nombre" class="form-label">Nombre</label>
                  <input type="text" class="form-control" id="nombre" placeholder="Nombre" maxlength="50" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="apellidos" class="form-label">Apellidos</label>
                  <input type="text" class="form-control" id="apellidos" placeholder="Apellidos" maxlength="100" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="correo" placeholder="nombre@dominio.cl" maxlength="100" required>
                <div class="form-text" id="error-correo"></div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
              </div>

              <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono (opcional)</label>
                <input type="text" class="form-control" id="telefono" placeholder="+56912345678">
              </div>

              <div class="mb-3">
                <label class="form-label d-block">Región</label>
                <input type="hidden" id="regionSeleccionada" required>
                <div class="dropdown">
                  <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start d-flex justify-content-between align-items-center" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="btnRegion">
                    Seleccionar Región
                  </button>
                  <ul class="dropdown-menu w-100" id="listaRegion"></ul>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label d-block">Comuna</label>
                <input type="hidden" id="comunaSeleccionada" required>
                <div class="dropdown">
                  <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start d-flex justify-content-between align-items-center" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="btnComuna" disabled>
                    Selecciona una región primero
                  </button>
                  <ul class="dropdown-menu w-100" id="listaComuna"></ul>
                </div>
              </div>

              <div class="mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="direccion" placeholder="Calle, número, depto" maxlength="300" required>
              </div>

              <button type="submit" class="btn btn-success w-100 py-2 mt-3" style="background-color: rgb(31, 31, 88);">Registrar Usuario</button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btnCerrarSesion').addEventListener('click', () => {
        localStorage.removeItem('usuarioActual');
        window.location.href = 'login.html';
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="registroUsuario.js"></script>
</body>
</html>
