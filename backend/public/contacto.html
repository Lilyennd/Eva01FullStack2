<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<style>
 h1 {
    text-align: center;
    color: white;
    padding-top: 30px;
    margin-bottom: 30px;
   }
</style>
<body class="background">
 <div class="container">
  <div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-5">
      <div class="card shadow border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
          <h3 style="text-align: center;">Contactanos</h3>

          <form id="formContact">
            <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre"maxlength="100"required>
            </div>

            <div class="mb-3">
            <label for="correo" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="correo" placeholder="nombre@dominio.cl" maxlength="100" required>
            <div class="form-text text-danger" id="error-correo"></div>
            </div>

            <div class="mb-3">
            <label for="comentario" class="form-label">Comentario</label>
             <textarea class="form-control" id="comentario" rows="5"placeholder="Escribe tu comentario..."maxlength="500"required></textarea>
             <br>
            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Enviar mensaje</button>



           </form>
        </div>
        </div>
      </div>
    </div>
  </div>

    
</body>
</html>
